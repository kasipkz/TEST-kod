/* ---------- Данияр AI чаты ---------- */
var cs={st:'idle',d:{}};
function say(t,who,qr){var c=$('chat'),m=el('div','m '+(who||'b'),t);c.appendChild(m);if(qr){var q=el('div','qr');qr.forEach(function(x){var b=el('button',null,x[0]);b.onclick=function(){q.remove();user(x[1]||x[0])};q.appendChild(b)});c.appendChild(q)}c.scrollTop=c.scrollHeight}

function reply(raw){var t=raw.toLowerCase().trim();

 if(cs.st==='name'){if(t.length<2){say('Атыңызды жазыңыз 🙂');return}cs.d.name=raw.trim();cs.st='phone';say('Рахмет, '+cs.d.name+'! Телефон нөміріңізді жазыңыз 📱');return}
 if(cs.st==='phone'){if(!phoneOk(raw)){say('Нөмір дұрыс емес. Мысалы: +7 701 123 45 67');return}cs.d.phone=raw.trim();cs.st='event';say('Қандай той өткізгіңіз келеді?',null,EV.map(function(e){return[e]}));return}
 if(cs.st==='event'){var ev=EV.filter(function(e){return t.indexOf(e.toLowerCase().slice(0,5))>-1})[0];if(!ev){say('Тізімнен таңдаңыз 👇',null,EV.map(function(e){return[e]}));return}cs.d.event=ev;cs.st='tariff';say('Қай тарифті таңдайсыз?',null,[['Қола — 3000₸','қола'],['Күміс — 5000₸','күміс'],['Алтын — 10000₸','алтын']]);return}
 if(cs.st==='tariff'){var k=/қола/.test(t)?'std':/күміс/.test(t)?'prem':/алтын/.test(t)?'vip':'';if(!k){say('Тарифті таңдаңыз 👇',null,[['Қола — 3000₸','қола'],['Күміс — 5000₸','күміс'],['Алтын — 10000₸','алтын']]);return}
  addLead({name:cs.d.name,phone:cs.d.phone,event:cs.d.event,tariff:k,status:'Қызығушылық бар'});cs.st='idle';say('✅ '+cs.d.name+', өтінішіңіз қабылданды! '+TN[k]+' тарифі ('+PR[k]+'₸). Менеджеріміз Меруерт жақында хабарласады. Алдымен ТЕГІН көріңіз 🎁');cs.d={};return}
 if(/той/.test(t)){cs.st='name';cs.d={};say('Той құтты болсын! 🎉 Қуанышты күніңіз берекелі болсын! Атыңыз кім?');return}
 if(/сәлем|салем|ассалау|привет|hello|hi\b/.test(t)){say('Сәлем! 👋 Мен Данияр — қазақша сатушы AI. Тойыңыз туралы айту үшін «Той» деп жазыңыз, ал бағасын «Бағасы қанша?» деп сұраңыз.');return}
 if(/рахмет|спасибо/.test(t)){say('Оқасы жоқ! 💛');return}
 say('Түсіндім 🙂 Тойыңыз туралы айту үшін «Той» деп жазыңыз немесе бағасын сұраңыз: «Бағасы қанша?»',null,[['Бағасы қанша?'],['Той']])}
function reAsk(){var m={name:'Атыңыз кім?',phone:'Телефон нөміріңізді жазыңыз 📱',event:'Қандай той?',tariff:'Қай тарифті таңдайсыз?'}[cs.st];if(m)say(m)}
$('cs').onclick=send;$('ci').onkeydown=function(e){if(e.key==='Enter')send()};function send(){var v=$('ci').value.trim();if(!v)return;$('ci').value='';user(v)}
say('Сәлем! 👋 Мен Данияр — қазақша сатушы AI. «Той» деп жазыңыз немесе «Бағасы қанша?» деп сұраңыз.',null,[['Бағасы қанша?'],['Той']]);

 var h=el('div','hd'),av=el('div','av',e.e),w=el('div');w.appendChild(el('h3',null,e.n));w.appendChild(el('div','rl',e.role));h.appendChild(av);h.appendChild(w);c.appendChild(h);
 c.appendChild(el('div','sts','🟢 Желіде'));var q=el('div','cur');q.appendChild(el('small',null,'Қазіргі тапсырма'));q.appendChild(el('b',null,curTask(id)));c.appendChild(q);

 var b=el('button','btn',' ➕ Осы қызметкерге тапсырма беру');b.style.cssText='width:100%;margin-top:12px';b.onclick=function(){closeCard();$('te').value=id;$('tx').focus();$('tx').scrollIntoView({behavior:'smooth',block:'center'})};c.appendChild(b);
 $('ov').classList.add('on')}

/* ================= 3D кеңсе ================= */
var FW=12,FH=9,WH=3,U=30,world=$('world'),stage=$('stage'),persp=$('persp'),chars={};
function px(v){return v*U+'px'}
function box(x,y,w,d,h,o){o=o||{};var b=el('div','bx');b.style.cssText='left:'+px(x)+';top:'+px(y)+';width:'+px(w)+';height:'+px(d)+';transform:translateZ('+(o.z?px(o.z):'0')+')';
 var t=el('div','t'),f=el('div','f'),l=el('div','l'),r=el('div','r');t.style.transform='translateZ('+px(h)+')';t.style.background=o.top||'#fff';f.style.height=px(h);f.style.background=o.front||'#ebe6db';l.style.width=px(h);l.style.background=o.side||'#ddd6c6';r.style.width=px(h);r.style.background=o.side||'#ddd6c6';
 [t,f,l,r].forEach(function(n){b.appendChild(n)});if(o.cls){t.classList.add(o.cls)}if(o.scr){f.classList.add('scr')}world.appendChild(b);return b}
function shadow(x,y,w,d){var s=el('div','sh');s.style.cssText='left:'+px(x-.1)+';top:'+px(y)+';width:'+px(w+.3)+';height:'+px(d+.3);world.appendChild(s)}
function bill(x,y,html,size){var b=el('div','bb');b.style.cssText='left:'+px(x)+';top:'+px(y)+';font-size:'+px(size||1.6)+';line-height:1;width:auto';b.innerHTML=html;b.style.pointerEvents='none';world.appendChild(b);return b}
function desk(x,y){shadow(x,y,2.4,1.1);box(x,y,2.4,1.1,.55,{top:'#fff',front:'#f1eee6',side:'#e2ddd0'});
 [x+.35,x+1.3].forEach(function(mx){box(mx,y+.15,.75,.08,.5,{z:.55,top:'#cfd6e4',front:'#3b4a6b',side:'#aab2c4',scr:1});box(mx+.3,y+.2,.15,.15,.1,{z:.55,top:'#cfd6e4',front:'#aab2c4',side:'#aab2c4'})});
 box(x+.9,y+.62,.6,.28,.04,{z:.55,top:'#e9edf5',front:'#c6cddb',side:'#c6cddb'});
 var cx=x+.9;box(cx,y+1.35,.62,.55,.3,{top:'#7f8fb4',front:'#6a7aa0',side:'#5b6a8d'});box(cx,y+1.8,.62,.1,.62,{top:'#6a7aa0',front:'#5b6a8d',side:'#4f5d7e'})}
function build(){
 var rug=el('div','rug');rug.style.cssText='left:'+px(1.4)+';top:'+px(2.2)+';width:'+px(9.2)+';height:'+px(5.6);world.appendChild(rug);
 var wall=el('div','wall');wall.style.height=px(WH);
 [[.8,.7,2.4,1.6],[8.8,.7,2.4,1.6]].forEach(function(w){var n=el('div','win');n.style.cssText='left:'+px(w[0])+';top:'+px(w[1])+';width:'+px(w[2])+';height:'+px(w[3]);n.appendChild(el('i'));wall.appendChild(n)});
 var sg=el('div','sign','QOSSHY JOLY • AI SALES DEPARTMENT • 24/7');sg.style.cssText='top:'+px(.8)+';width:'+px(4.2);wall.appendChild(sg);world.appendChild(wall);
 [[3,3],[6.6,3],[3,5.7],[6.6,5.7]].forEach(function(d){desk(d[0],d[1])});
 box(10.6,.35,.8,.8,.5,{top:'#b88a5a',front:'#a07448',side:'#8a613a'});bill(11,.9,'🪴',1.5);bill(.8,.9,'🌷',1.3);box(.4,.4,.8,.8,.45,{top:'#c98a5a',front:'#b0734a',side:'#9a603b'});bill(10.9,8.3,'🪴',1.5);bill(1,8.3,'🌸',1.4);
 bill(5.2,1.4,'🕐',.8);
 EMP.forEach(function(e,i){var c=el('div','ch'),b=el('div','bb');c.style.setProperty('--c',e.c);b.style.setProperty('--c',e.c);b.style.setProperty('--c2',e.c2);b.style.setProperty('--h',e.h);b.style.setProperty('--long',e.long?'block':'none');
  b.innerHTML='<div class="tag">'+e.e+' '+e.n+'</div><div class="fig"><div class="lg2 a"></div><div class="lg2 b"></div><div class="am a"></div><div class="am b"></div><div class="bd"></div><div class="hd"><div class="lh"></div><div class="hr"></div><div class="ey a"></div><div class="ey b"></div></div></div>';
  c.appendChild(b);c.onclick=function(){openCard(e.id)};c.setAttribute('role','button');c.setAttribute('aria-label',e.n+' карточкасын ашу');world.appendChild(c);
  chars[e.id]={el:c,fig:b.querySelector('.fig'),x:[2,6,10][i],y:[2.2,2.2,7.8][i],t:null};place(e.id,chars[e.id].x,chars[e.id].y,true)})}
function place(id,x,y,instant){var c=chars[id];c.el.style.transition=instant?'none':'';c.el.style.transform='translate3d('+px(x)+','+px(y)+',0)';c.x=x;c.y=y;if(instant){void c.el.offsetWidth;c.el.style.transition=''}}
var WP=[[1.2,2.2],[1.2,5],[1.2,7.8],[5.6,2.1],[5.8,4.8],[5.6,7.9],[2.2,8],[8.6,8],[10.6,2.4],[10.8,5],[10.8,7.6],[4.2,5.2],[9.9,4.8],[5.9,6.9]],paused=false;
function wander(id){var c=chars[id];if(!paused){var used=Object.keys(chars).map(function(k){return chars[k].tx}).filter(Boolean),opts=WP.filter(function(p){return used.indexOf(p)<0&&(p[0]!==c.x||p[1]!==c.y)}),p=opts[Math.floor(Math.random()*opts.length)];
  if(p){var dx=p[0]-c.x,dist=Math.hypot(dx,p[1]-c.y),dur=Math.max(1.4,dist*.42);c.tx=p;c.el.style.transition='transform '+dur+'s linear';c.fig.style.setProperty('--d',dx<0?-1:1);c.el.classList.add('walk');c.el.style.transform='translate3d('+px(p[0])+','+px(p[1])+',0)';c.x=p[0];c.y=p[1];setTimeout(function(){c.el.classList.remove('walk')},dur*1000)}}
 c.t=setTimeout(function(){wander(id)},2000+Math.random()*1000)}
$('pause').onclick=function(){paused=!paused;this.textContent=paused?'▶ Жалғастыру':'⏸ Тоқтату'};
function fit(){var w=stage.clientWidth;U=Math.max(18,Math.floor(w/FW*.97));document.documentElement.style.setProperty('--u',U+'px');
 var w2=FW*U,h2=FH*U,wallP=WH*U*Math.sin(52*Math.PI/180),floorP=h2*Math.cos(52*Math.PI/180);
 world.style.width=w2+'px';world.style.height=h2+'px';world.style.top=Math.round(wallP+U*.35)+'px';persp.style.height='100%';stage.style.height=Math.round(wallP+floorP+U*1.3)+'px';
 world.querySelectorAll('.bx,.sh,.bb,.rug,.wall').forEach(function(){});}
build();fit();
var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(rebuild,150)});
function rebuild(){var pos={};Object.keys(chars).forEach(function(k){pos[k]=[chars[k].x,chars[k].y]});
 [].slice.call(world.children).forEach(function(n){if(!n.classList.contains('floor'))n.remove()});fit();build();Object.keys(pos).forEach(function(k){place(k,pos[k][0],pos[k][1],true)})}
EMP.forEach(function(e,i){setTimeout(function(){wander(e.id)},700+i*600)});
})();
